<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<!-- daisyUI 5：组件与基础样式；themes.css 提供 corporate 等内置主题 -->
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50" rel="stylesheet" type="text/css" />
<link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.50/themes.css" rel="stylesheet" type="text/css" />
<!-- Tailwind 4 浏览器版：仅生成工具类，不再使用构建期配置 -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style type="text/tailwindcss">
  @theme {
    --font-sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo,
      Consolas, monospace;
  }
</style>

<style>
  /* daisyUI 5 没有 Markdown / prose 正文组件；这里只约束 Issue 正文与设计文档内容排版。 */
  .md-content {
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: 0.875rem;
    line-height: 1.7;
    color: var(--color-base-content);
  }

  .md-content > :first-child {
    margin-top: 0;
  }

  .md-content > :last-child {
    margin-bottom: 0;
  }

  .md-content p,
  .md-content ul,
  .md-content ol,
  .md-content blockquote,
  .md-content pre,
  .md-content table,
  .md-content hr {
    margin-top: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .md-content h3,
  .md-content h4,
  .md-content h5,
  .md-content h6 {
    margin-top: 1.25rem;
    margin-bottom: 0.5rem;
    color: var(--color-base-content);
    font-weight: 600;
    line-height: 1.4;
  }

  .md-content h3 {
    font-size: 1rem;
  }

  .md-content h4 {
    font-size: 0.9375rem;
  }

  .md-content h5,
  .md-content h6 {
    font-size: 0.875rem;
  }

  .md-content ul,
  .md-content ol {
    padding-left: 1.5rem;
  }

  .md-content ul {
    list-style: disc;
  }

  .md-content ol {
    list-style: decimal;
  }

  .md-content li + li {
    margin-top: 0.25rem;
  }

  .md-content li > ul,
  .md-content li > ol {
    margin-top: 0.25rem;
    margin-bottom: 0.25rem;
  }

  .md-content blockquote {
    border-left: 4px solid var(--color-base-300);
    padding-left: 1rem;
    color: color-mix(in oklch, var(--color-base-content) 70%, transparent);
  }

  .md-content code {
    border-radius: 0.25rem;
    background-color: var(--color-base-200);
    padding: 0.1rem 0.3rem;
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
    font-size: 0.85em;
    overflow-wrap: anywhere;
  }

  .md-content pre {
    max-width: 100%;
    overflow-x: auto;
    border: 1px solid var(--color-base-300);
    border-radius: 0.5rem;
    background-color: var(--color-base-200);
    padding: 0.75rem;
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace);
    font-size: 0.75rem;
    line-height: 1.6;
    white-space: pre;
    overflow-wrap: normal;
  }

  .md-content pre code {
    border-radius: 0;
    background: transparent;
    padding: 0;
    font-size: inherit;
    overflow-wrap: normal;
  }

  .md-content a {
    color: var(--color-primary);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .md-content a:hover {
    opacity: 0.8;
  }

  .md-content hr {
    border-top: 1px solid var(--color-base-300);
  }

  .md-content table {
    display: block;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    border-collapse: collapse;
    font-size: 0.8125rem;
  }

  .md-content th,
  .md-content td {
    border: 1px solid var(--color-base-300);
    padding: 0.375rem 0.625rem;
    text-align: left;
    vertical-align: top;
  }

  .md-content thead th {
    background-color: var(--color-base-200);
    font-weight: 600;
    color: var(--color-base-content);
  }

  /* Issue 正文折叠预览：槽位高度由脚本写入，超出内容裁切，不撑高卡片。 */
  .gw-body-preview {
    min-width: 0;
  }

  .gw-body-preview-slot {
    position: relative;
    overflow: hidden;
  }

  .gw-body-preview-slot > * {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
  }

  .gw-body-preview-compact,
  .gw-body-preview-compact * {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
  }

  .gw-body-preview-ellipsis {
    height: 1.25rem;
    overflow: hidden;
    color: color-mix(in oklch, var(--color-base-content) 55%, transparent);
    font-size: 0.875rem;
    line-height: 1.25rem;
    letter-spacing: 0.15em;
    user-select: none;
  }

  /* daisyUI 5 组件自带焦点样式，原生链接与自定义可聚焦元素仍需统一可见焦点兜底。 */
  :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
  }

  /* daisyUI 5 没有全局 reduced-motion 开关；保留无障碍兜底。 */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }

  /* daisyUI 5 没有 sticky navbar 的全局锚点偏移能力。 */
  [id] {
    scroll-margin-top: 5.5rem;
  }
</style>
