; 放到 /etc/supervisor/conf.d/github-workflow.conf（路径按发行版调整）
; 安装示例：sudo apt install supervisor
; 改下方 directory / user / 命令路径后：
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start github-workflow-web github-workflow-worker

[program:github-workflow-web]
command=/home/linuxuser/.local/bin/uv run uvicorn main:app --host 127.0.0.1 --port 8095
directory=/home/linuxuser/workspace/py_space/jev_demo/github_workflow
user=linuxuser
autostart=true
autorestart=true
startretries=10
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/github-workflow-web.log
environment=HOME="/home/linuxuser"

[program:github-workflow-worker]
command=/home/linuxuser/.local/bin/uv run python -m app.tasks.worker
directory=/home/linuxuser/workspace/py_space/jev_demo/github_workflow
user=linuxuser
autostart=true
autorestart=true
startretries=10
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/supervisor/github-workflow-worker.log
environment=HOME="/home/linuxuser"
; v1 只允许一个 Worker，不要再复制一份 program
numprocs=1

[group:github-workflow]
programs=github-workflow-web,github-workflow-worker
