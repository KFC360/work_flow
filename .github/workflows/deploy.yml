# CD: after a PR is merged into master (push to master), deploy via Docker Compose.
# Required repo Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
# Optional: DEPLOY_PORT (default 22)
# Server user must run docker compose without interactive sudo.
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secrets
        run: |
          missing=0
          [ -n "${{ secrets.DEPLOY_HOST }}" ] || { echo "Missing secret: DEPLOY_HOST"; missing=1; }
          [ -n "${{ secrets.DEPLOY_USER }}" ] || { echo "Missing secret: DEPLOY_USER"; missing=1; }
          [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || { echo "Missing secret: DEPLOY_SSH_KEY"; missing=1; }
          [ -n "${{ secrets.DEPLOY_PATH }}" ] || { echo "Missing secret: DEPLOY_PATH"; missing=1; }
          exit "$missing"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            echo "==> cd $DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            echo "==> git pull"
            git fetch origin master
            git checkout master
            git pull --ff-only origin master
            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: docker not found in PATH=$PATH"
              exit 1
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "ERROR: docker compose plugin not found"
              exit 1
            fi
            chmod +x ./scripts/docker_deploy.sh
            echo "==> docker_deploy"
            ./scripts/docker_deploy.sh
            echo "==> deploy ok $(git rev-parse --short HEAD)"
            echo "==> smoke wait 30s"
            sleep 30
            chmod +x ./scripts/smoke_login_notify.sh
            echo "==> smoke_login_notify"
            ./scripts/smoke_login_notify.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
