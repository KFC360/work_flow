[project]
name = "github-workflow"
version = "0.1.0"
description = "GitHub Issues → design doc → codegen → PR"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "loguru>=0.7.2",
  "httpx>=0.27.2",
  "pyjwt>=2.9.0",
  "pwdlib[argon2]>=0.2.1",
  "markdown>=3.7",
  "nh3>=0.3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
]
smoke = [
  "playwright>=1.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
