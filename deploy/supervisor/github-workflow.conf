; DEPRECATED — production now uses Docker Compose (see compose.yaml and
; scripts/docker_deploy.sh). One-time cutover: deploy/docker/CUTOVER.md.
; Keep this file only as a rollback reference; do not install on new hosts.
;
; 历史：放到 /etc/supervisor/conf.d/github-workflow.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start github-workflow:*

[program:github-workflow-web]
command=/home/linuxuser/.local/bin/uv run uvicorn main:app --host 127.0.0.1 --port 8095
directory=/home/linuxuser/sites/work_flow
user=linuxuser
autostart=true
autorestart=true
startretries=10
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/github-workflow-web.log
environment=HOME="/home/linuxuser",PATH="/home/linuxuser/.opencode/bin:/home/linuxuser/.local/bin:/usr/local/bin:/usr/bin:/bin"

[program:github-workflow-worker]
command=/home/linuxuser/.local/bin/uv run python -m app.tasks.worker
directory=/home/linuxuser/sites/work_flow
user=linuxuser
autostart=true
autorestart=true
startretries=10
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/supervisor/github-workflow-worker.log
environment=HOME="/home/linuxuser",PATH="/home/linuxuser/.opencode/bin:/home/linuxuser/.local/bin:/usr/local/bin:/usr/bin:/bin"
; v1 只允许一个 Worker，不要再复制一份 program
numprocs=1

[group:github-workflow]
programs=github-workflow-web,github-workflow-worker
