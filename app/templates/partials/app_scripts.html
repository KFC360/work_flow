<script>
  (function () {
    var ok = document.getElementById('flash-ok');
    if (ok) {
      window.setTimeout(function () {
        ok.hidden = true;
      }, 5000);
    }

    document.addEventListener('click', function (event) {
      var dismiss = event.target.closest('[data-gw-dismiss]');
      if (!dismiss) return;
      var box = dismiss.closest('[role="status"], [role="alert"]');
      if (box) box.hidden = true;
    });

    var dialog = document.getElementById('gw-confirm');
    var titleEl = dialog ? document.getElementById('gw-confirm-title') : null;
    var bodyEl = dialog ? document.getElementById('gw-confirm-body') : null;
    var okButton = dialog ? dialog.querySelector('[data-gw-ok]') : null;
    var cancelButton = dialog ? dialog.querySelector('[data-gw-cancel]') : null;
    var backdrop = dialog ? dialog.querySelector('[data-gw-backdrop]') : null;
    var trigger = null;
    var pendingForm = null;
    var pendingSubmitter = null;

    function closeDialog() {
      if (dialog && typeof dialog.close === 'function' && dialog.open) dialog.close();
    }

    function openConfirm(form, button) {
      if (!dialog) return;
      pendingForm = form;
      pendingSubmitter = button && button.type === 'submit' ? button : null;
      trigger = button;
      titleEl.textContent = button.getAttribute('data-confirm-title') || '确认操作';
      bodyEl.textContent = button.getAttribute('data-confirm-body') || '';
      if (typeof dialog.showModal === 'function') {
        dialog.showModal();
        okButton.focus();
      }
    }

    document.addEventListener('submit', function (event) {
      var form = event.target;
      if (!form || form.tagName !== 'FORM') return;
      var submitter = event.submitter || null;
      if (form.hasAttribute('data-gw-confirm-form') && form.getAttribute('data-gw-confirmed') !== '1') {
        event.preventDefault();
        return;
      }
      if (submitter && submitter.hasAttribute('data-gw-confirm') && form.getAttribute('data-gw-confirmed') !== '1') {
        event.preventDefault();
        openConfirm(form, submitter);
        return;
      }
      var submitButton = submitter || form.querySelector('[data-gw-submit]') || form.querySelector('button');
      form.setAttribute('aria-busy', 'true');
      if (submitButton && !submitButton.disabled) {
        submitButton.disabled = true;
        submitButton.setAttribute('aria-busy', 'true');
        if (!submitButton.querySelector('[data-gw-spinner]')) {
          var spinner = document.createElement('span');
          spinner.className = 'loading loading-spinner loading-xs';
          spinner.setAttribute('data-gw-spinner', '');
          spinner.setAttribute('aria-hidden', 'true');
          submitButton.prepend(spinner);
        }
        var busyLabel = submitButton.getAttribute('data-gw-busy-label');
        if (busyLabel) {
          var spans = submitButton.querySelectorAll('span');
          for (var i = 0; i < spans.length; i += 1) {
            if (!spans[i].hasAttribute('data-gw-spinner') && !spans[i].classList.contains('loading')) {
              spans[i].textContent = busyLabel;
              break;
            }
          }
        }
      }
    });

    if (!dialog) return;

    document.addEventListener('click', function (event) {
      var button = event.target.closest('[data-gw-confirm]');
      if (!button) return;
      if (button.type === 'submit') event.preventDefault();
      openConfirm(button.closest('form'), button);
    });

    okButton.addEventListener('click', function () {
      var form = pendingForm;
      var submitter = pendingSubmitter;
      if (!form) {
        closeDialog();
        return;
      }
      form.setAttribute('data-gw-confirmed', '1');
      closeDialog();
      if (typeof form.requestSubmit === 'function') {
        form.requestSubmit(submitter || undefined);
      } else {
        form.submit();
      }
      window.setTimeout(function () {
        form.removeAttribute('data-gw-confirmed');
      }, 0);
    });

    cancelButton.addEventListener('click', closeDialog);
    if (backdrop) backdrop.addEventListener('click', closeDialog);
    dialog.addEventListener('close', function () {
      var previous = trigger;
      pendingForm = null;
      pendingSubmitter = null;
      trigger = null;
      if (previous) previous.focus();
    });
  })();
</script>
